name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tournament
          POSTGRES_PASSWORD: tournament
          POSTGRES_DB: tournament
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tournament"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://tournament:tournament@localhost:5432/tournament
      TEST_DATABASE_URL: postgresql+psycopg://tournament:tournament@localhost:5432/tournament_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Migrations match models
        run: |
          alembic upgrade head
          alembic check

      - name: Test
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tournament-pm .
