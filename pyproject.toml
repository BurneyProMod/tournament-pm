[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tournament-pm"
version = "0.1.0"
description = "Swiss-style tournament manager with Elo ratings: REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tournament_pm"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tournament_pm --cov-report=term-missing"
