services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tournament
      POSTGRES_PASSWORD: tournament  # local development only
      POSTGRES_DB: tournament
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tournament"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      # Read by the app from Phase 2 onward.
      DATABASE_URL: postgresql+psycopg://tournament:tournament@db:5432/tournament
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
